<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Credent · Build Studio — Live Demo</title>
<meta name="description" content="Watch Emrys turn a sentence into a system: type a project, and Credent assembles the real 3D model — live." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  :root{
    --cyan:#33EBFF; --blue:#0087D1; --indigo:#6C5CE7; --magenta:#FF00FF;
    --bg:#05060c; --text:#eef1fb; --dim:#9aa3c0;
    --stroke:rgba(255,255,255,.12);
    --grad:linear-gradient(120deg,var(--cyan),var(--blue) 35%,var(--indigo) 65%,var(--magenta));
    --rail:clamp(330px,31vw,440px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .reel{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(55% 50% at 62% -8%, rgba(108,92,231,.22), transparent 70%),
      radial-gradient(45% 45% at 92% 12%, rgba(255,0,255,.12), transparent 70%),
      radial-gradient(50% 55% at 50% 110%, rgba(51,235,255,.12), transparent 70%),
      linear-gradient(180deg,#070815,#04050b 70%);}
  canvas{display:block}
  #bg{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.65}
  .grid{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.32;
    background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);
    background-size:46px 46px;mask:radial-gradient(75% 75% at 60% 55%,#000 40%,transparent 100%);animation:gridpan 22s linear infinite}
  @keyframes gridpan{to{background-position:46px 46px}}
  .vignette{position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 260px rgba(0,0,0,.85)}
  .scan{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.45;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 4px)}
  .hud{position:absolute;inset:24px;z-index:6;pointer-events:none}
  .br{position:absolute;width:30px;height:30px;border:2px solid rgba(120,200,255,.4);filter:drop-shadow(0 0 6px rgba(51,235,255,.4))}
  .br.tl{top:0;left:0;border-right:0;border-bottom:0}.br.tr{top:0;right:0;border-left:0;border-bottom:0}
  .br.bl{bottom:0;left:0;border-right:0;border-top:0}.br.br2{bottom:0;right:0;border-left:0;border-top:0}

  /* ---- the 3D stage: the dominant right side ---- */
  .stage{position:absolute;left:var(--rail);top:0;right:0;bottom:0;z-index:2}
  #three{position:absolute;inset:0;width:100%;height:100%}
  .labels{position:absolute;inset:0;z-index:4;pointer-events:none}
  .lab{position:absolute;transform:translate(-50%,-50%);font-family:"JetBrains Mono",monospace;font-size:11.5px;
    color:#dff3ff;white-space:nowrap;opacity:0;transition:opacity .4s}
  .lab.on{opacity:.95}
  .lab .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);display:inline-block;margin-right:8px;vertical-align:middle}
  .lab .t{background:rgba(8,12,22,.7);border:1px solid rgba(120,200,255,.32);border-radius:7px;padding:4px 9px;backdrop-filter:blur(6px)}

  /* brand */
  .brandbar{position:absolute;top:32px;left:34px;z-index:8;display:flex;align-items:center;gap:13px}
  .brandbar .mark{width:42px;height:31px;filter:drop-shadow(0 4px 16px rgba(108,92,231,.55))}
  .brandbar .wm{font-weight:800;letter-spacing:.14em;font-size:15px}
  .brandbar .wm span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brandbar .sub{font-size:11px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}
  .tag-pill{margin-left:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#bfe9ff;
    border:1px solid rgba(51,235,255,.35);border-radius:999px;padding:5px 10px;background:rgba(51,235,255,.06)}

  .nowbuild{position:absolute;top:34px;right:38px;z-index:7;text-align:right}
  .nowbuild .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .nowbuild .v{font-size:18px;font-weight:700;margin-top:3px}
  .nowbuild .v b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* chat rail (the smaller side) */
  .chat{position:absolute;left:24px;top:92px;bottom:24px;z-index:8;width:calc(var(--rail) - 42px);display:flex;flex-direction:column;
    background:linear-gradient(165deg,rgba(20,24,42,.72),rgba(9,11,22,.62));border:1px solid var(--stroke);border-radius:22px;
    backdrop-filter:blur(22px) saturate(140%);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
  .chat-h{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .orb{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 200deg,var(--cyan),var(--indigo),var(--magenta),var(--blue),var(--cyan));
    box-shadow:0 0 18px rgba(108,92,231,.7);position:relative;flex:none}
  .orb::after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),#0a0c18}
  .chat-h .nm{font-weight:700;font-size:14px}.chat-h .st{font-size:11px;color:#7fffc4;display:flex;align-items:center;gap:5px}
  .chat-h .st i{width:6px;height:6px;border-radius:50%;background:#28e08a;box-shadow:0 0 8px #28e08a;display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .msgs{flex:1;padding:18px 16px 8px;display:flex;flex-direction:column;gap:11px;overflow:hidden;justify-content:flex-end}
  .b{max-width:88%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.5;opacity:0;transform:translateY(10px);animation:rise .45s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .b.them{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:5px}
  .b.me{align-self:flex-end;color:#04111a;background:linear-gradient(120deg,var(--cyan),#6fd0ff);border-bottom-right-radius:5px;font-weight:500;box-shadow:0 8px 26px rgba(51,235,255,.3)}
  .b.them b{color:#bfe9ff}
  .dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:#cdd6f5;animation:bounce 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
  .inputbar{display:flex;align-items:center;gap:10px;margin:8px 14px 16px;padding:12px 14px;border-radius:14px;background:rgba(8,10,20,.7);border:1px solid rgba(255,255,255,.1)}
  .inputbar .ph{flex:1;font-size:14px;white-space:nowrap;overflow:hidden}
  .inputbar .ph.empty{color:#5b6488}
  .caret{display:inline-block;width:2px;height:16px;background:var(--cyan);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--cyan)}
  @keyframes blink{50%{opacity:0}}
  .send{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;transition:transform .2s}
  .send.go{transform:scale(1.12)}.send svg{width:18px;height:18px}

  /* caption (current step) — bottom of the 3D stage */
  .caption{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:5;text-align:center;width:min(60%,560px);opacity:0;transition:opacity .4s}
  .caption .step{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}
  .caption .txt{font-size:17px;font-weight:600;margin-top:6px;line-height:1.4;text-shadow:0 2px 22px rgba(0,0,0,.8)}

  /* bill of materials */
  .bom{position:absolute;right:38px;top:96px;z-index:5;width:258px;
    background:linear-gradient(165deg,rgba(20,24,42,.6),rgba(9,11,22,.5));border:1px solid var(--stroke);border-radius:18px;
    backdrop-filter:blur(18px);padding:15px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45);opacity:0;transform:translateX(14px);transition:.5s}
  .bom.show{opacity:1;transform:none}
  .bom h4{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between}
  .bom h4 span{color:var(--cyan)}
  .bom .it{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:#aeb6d4;opacity:.4;transition:.35s}
  .bom .it.on{opacity:1;color:var(--text)}
  .bom .ck{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.2);flex:none;display:grid;place-items:center;transition:.35s}
  .bom .it.on .ck{background:linear-gradient(120deg,var(--cyan),var(--blue));border-color:transparent;box-shadow:0 0 12px rgba(51,235,255,.5)}
  .bom .ck svg{width:11px;height:11px;opacity:0;transition:.3s}.bom .it.on .ck svg{opacity:1}

  /* finale — over the stage, lower third so the model glows above */
  .finale{position:absolute;inset:0;z-index:7;display:grid;place-items:end center;pointer-events:none;opacity:0;transition:opacity .8s;
    background:radial-gradient(72% 60% at 50% 40%,rgba(5,6,12,.04),rgba(5,6,12,.6))}
  .finale.show{opacity:1}
  .finale .in{text-align:center;transform:translateY(16px);transition:transform .9s cubic-bezier(.2,.8,.2,1);padding-bottom:7vh}
  .finale.show .in{transform:none}
  .finale .ln{font-size:clamp(26px,4vw,50px);font-weight:800;letter-spacing:-.01em;line-height:1.04}
  .finale .ln b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .finale .sub{margin-top:14px;color:#c7cfe6;font-size:15px;letter-spacing:.03em;text-shadow:0 2px 16px rgba(0,0,0,.7)}
  .finale .wm{margin-top:26px;font-weight:800;letter-spacing:.3em;font-size:13px}
  .finale .wm span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;color:var(--dim);font-size:13px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:14px}
  .spin{width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(255,255,255,.12);border-top-color:var(--cyan);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .replay{position:absolute;bottom:20px;right:24px;z-index:9;font-family:inherit;font-size:12px;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:999px;padding:8px 15px;cursor:pointer;backdrop-filter:blur(8px);opacity:0;transition:.3s}
  .replay.show{opacity:1}.replay:hover{color:var(--text);border-color:rgba(51,235,255,.5)}
  @media(max-width:820px){:root{--rail:300px}.bom{display:none}}
</style>
</head>
<body>
<div class="reel" id="reel">
  <canvas id="bg"></canvas>
  <div class="grid"></div>

  <div class="stage" id="stage">
    <canvas id="three"></canvas>
    <div class="labels" id="labels"></div>
    <div class="loading" id="loading"><div class="spin"></div><div>Loading the real 3D model…</div></div>
    <div class="nowbuild" id="nowbuild" style="opacity:0">
      <div class="k">Now assembling</div>
      <div class="v">Voice Assistant <b>· Mino</b></div>
    </div>
    <div class="bom" id="bom">
      <h4>Bill of materials <span id="bomcount">0 / 7</span></h4>
      <div id="bomlist"></div>
    </div>
    <div class="caption" id="caption"><div class="step" id="capstep"></div><div class="txt" id="captxt"></div></div>
    <div class="finale" id="finale">
      <div class="in">
        <div class="ln">From a sentence<br/>to a <b>system.</b></div>
        <div class="sub">Emrys teaches it, remembers it, and builds it — in real time.</div>
        <div class="wm">CRE<span>DENT</span></div>
      </div>
    </div>
  </div>

  <div class="hud"><span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br br2"></span></div>
  <div class="scan"></div><div class="vignette"></div>

  <div class="brandbar">
    <svg class="mark" viewBox="0 0 367 264" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M181.54 39.55L226.7 38.43l1.45.79C240.47 177.27 183.54 189.18 183.54 189.18L181.54 39.6Z" fill="#FF00FF"/>
      <path d="M181.83 41.12C279.1 27.14 299.33 46.36 313.7 99.03 329.17 155.78 271.07 205.52 271.07 205.52 420.16 157.29 396.45-27.73 180.22 4.05" fill="#00FFFF"/>
      <path d="M270.64 244.26C374.42 231.28 365.9 106.05 365.9 106.05 365.9 106.05 361.25 204.28 228.56 210.4" fill="#FF00FF"/>
      <path d="M180.88 249.79C194.64 221.63 211.36 188.56 224.63 160.09L227.3 208.87 272.54 243.91C240.68 249.56 180.88 249.79 180.88 249.79Z" fill="#0000FF"/>
      <path d="M159.45 2.53l-.12 34C159.33 36.54 36.07 5.6 60.51 142.69 73.64 216.28 176.51 251.27 229.11 134.51 229.11 134.51 200.03 293.32 82.18 257.06-18.48 226.09-57.92-19.59 159.45 2.53Z" fill="#FF00FF" stroke="#010805" stroke-width="2.26"/>
      <path d="M160.48 56.07C66.02 35.69 58.86 110.79 58.86 110.79 54.2 72.28 76.83 46.15 109.2 35.69 131.01 28.64 159.74 35.29 159.74 35.29" fill="#00FFFF"/>
    </svg>
    <div><div class="wm">CRE<span>DENT</span></div><div class="sub">Build Studio</div></div>
    <span class="tag-pill">Live 3D</span>
  </div>

  <aside class="chat">
    <div class="chat-h">
      <div class="orb"></div>
      <div><div class="nm">Emrys</div><div class="st"><i></i> AI build partner · online</div></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <div class="ph empty" id="ph">Ask Emrys to build your project…</div>
      <div class="send" id="send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21 23 12 2 3l.01 7L17 12 2.01 14z"/></svg></div>
    </div>
  </aside>

  <button class="replay" id="replay">↻ Replay</button>
</div>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let bloom=null, EffectComposer, RenderPass, UnrealBloomPass;
try {
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
} catch(e){ console.warn('bloom unavailable', e); }

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const stage = $('#stage'), canvas = $('#three');

/* ---- background particles ---- */
const bg=$('#bg'), bx=bg.getContext('2d'); let pts=[];
function sizeBg(){ bg.width=innerWidth; bg.height=innerHeight;
  pts=Array.from({length:Math.min(90,(bg.width*bg.height)/22000|0)},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,z:Math.random()*.8+.2,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16})); }
function drawBg(){ bx.clearRect(0,0,bg.width,bg.height);
  for(const p of pts){ p.x+=p.vx;p.y+=p.vy; if(p.x<0)p.x+=bg.width;if(p.x>bg.width)p.x-=bg.width;if(p.y<0)p.y+=bg.height;if(p.y>bg.height)p.y-=bg.height;
    bx.beginPath();bx.arc(p.x,p.y,p.z*1.7,0,7);bx.fillStyle=`rgba(120,190,255,${p.z*.5})`;bx.fill(); } }

/* ---- three scene ---- */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.1,200);
scene.add(new THREE.AmbientLight(0x415072,1.0));
scene.add(new THREE.HemisphereLight(0x9fc4ff,0x141826,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(6,9,5); scene.add(key);
const rimC=new THREE.PointLight(0x33EBFF,70,40); rimC.position.set(-7,3,-4); scene.add(rimC);
const rimM=new THREE.PointLight(0xFF00FF,55,40); rimM.position.set(6,2,-6); scene.add(rimM);
try {
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
} catch(e){ console.warn('env unavailable',e); }

const floor=new THREE.Mesh(new THREE.CircleGeometry(9,64),
  new THREE.MeshStandardMaterial({color:0x0a0e1c,metalness:.5,roughness:.5,transparent:true,opacity:.85}));
floor.rotation.x=-Math.PI/2; floor.position.y=-.01; scene.add(floor);
const grid=new THREE.GridHelper(18,30,0x2a3970,0x162043); grid.material.transparent=true; grid.material.opacity=.35; scene.add(grid);
const build=new THREE.Group(); scene.add(build);

/* ---- real Mino assembly (STL housing/cover + GLB electronics) ---- */
const ASSET='models/voice-assistant';
const PARTS=[
  {file:'Housing.stl',       name:'Housing',          step:'Step 1 · Chassis', cap:'3D-printed housing — the case every component clicks into.', mat:'plastic'},
  {file:'parts/esp32_p.glb', name:'ESP32-S3 AI Cam',  step:'Step 2 · The brain', cap:'ESP32-S3 AI Cam — it listens, runs the AI, and sees.'},
  {file:'parts/speaker_p.glb',name:'Speaker + amp',   step:'Step 3 · Voice', cap:'Speaker + MAX98357A amp — this is how Mino talks back.'},
  {file:'parts/bms_p.glb',   name:'IP5306 BMS',       step:'Step 4 · Power', cap:'IP5306 BMS — safe USB-C charging and clean power.'},
  {file:'parts/switch_p.glb',name:'Power switch',     step:'Step 5 · Wake', cap:'Mini power switch — one tap to bring Mino to life.'},
  {file:'parts/battery_p.glb',name:'Li-Po battery',   step:'Step 6 · Portable', cap:'Li-Po battery — fully wireless, take Mino anywhere.'},
  {file:'Cover.stl',         name:'Cover',            step:'Step 7 · Seal it', cap:'Snap on the cover, power up — Mino says hello. 👋', mat:'cyan'},
];
function stlMat(kind){
  if(kind==='cyan') return new THREE.MeshStandardMaterial({color:0x33EBFF,metalness:.25,roughness:.16,emissive:0x0a4a58,emissiveIntensity:.45,transparent:true,opacity:.5});
  return new THREE.MeshStandardMaterial({color:0xd2d9e6,metalness:.08,roughness:.55}); // printed plastic
}
const stlL=new STLLoader(), gltfL=new GLTFLoader();
let modelParts=[], LOOK_Y=1.4, ORBIT_R=6.6, ready=false;

async function loadAssembly(){
  const loaded=[];
  for(const pd of PARTS){
    try{
      if(/\.glb$/i.test(pd.file)){
        const g=await gltfL.loadAsync(`${ASSET}/${pd.file}`); const obj=g.scene; obj.updateMatrixWorld(true);
        loaded.push({pd,obj});
      } else {
        const geo=await stlL.loadAsync(`${ASSET}/${pd.file}`); geo.computeVertexNormals();
        loaded.push({pd,geo});
      }
    }catch(e){ console.warn('part failed',pd.file,e?.message); }
  }
  if(!loaded.length) return;
  // shared bounds across the whole device (native mm space)
  const whole=new THREE.Box3();
  loaded.forEach(L=>{ if(L.obj) whole.union(new THREE.Box3().setFromObject(L.obj)); else { L.geo.computeBoundingBox(); whole.union(L.geo.boundingBox);} });
  const size=whole.getSize(new THREE.Vector3()), center=whole.getCenter(new THREE.Vector3());
  const longest=Math.max(size.x,size.y,size.z)||1, norm=5/longest, minY=whole.min.y;
  LOOK_Y=(size.y*norm)*0.5+0.35; ORBIT_R=7.4;
  loaded.forEach((L,i)=>{
    let child;
    if(L.obj){ child=L.obj; child.traverse(c=>{ if(c.isMesh){ c.material.envMapIntensity=1.3; c.castShadow=true; } }); }
    else child=new THREE.Mesh(L.geo, stlMat(L.pd.mat));
    const ng=new THREE.Group(); ng.scale.setScalar(norm); ng.position.set(-center.x*norm,-minY*norm,-center.z*norm); ng.add(child);
    const holder=new THREE.Group(); holder.add(ng);
    holder.userData.from=new THREE.Vector3(0,size.y*norm+3.2+i*0.35,0);
    holder.position.copy(holder.userData.from); holder.visible=false; holder.scale.setScalar(.001);
    build.add(holder);
    modelParts.push({pd:L.pd,holder,child,isStl:!L.obj});
  });
  ready=true; $('#loading').style.display='none';
}

/* reveal one part with a fly-in */
function spawnPart(i){
  return new Promise(res=>{
    const P=modelParts[i]; if(!P){res();return;}
    P.holder.visible=true; const from=P.holder.userData.from, to=new THREE.Vector3(0,0,0);
    const t0=performance.now(), dur=900;
    (function step(){
      const k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3);
      P.holder.position.lerpVectors(from,to,e); P.holder.scale.setScalar(.001+ .999*e);
      if(P.isStl && P.child.material.emissive){ P.child.material.emissiveIntensity=(P.pd.mat==='cyan'?.45:0)+(1-e)*1.6; }
      if(k<1) requestAnimationFrame(step); else { addCallout(P.child,P.pd.name); res(); }
    })();
  });
}

/* projected CAD callouts (only the newest) */
const labels=$('#labels'); let tracked=[];
function addCallout(child,name){
  tracked.forEach(t=>{ t.el.classList.remove('on'); const el=t.el; setTimeout(()=>el.remove(),400); }); tracked=[];
  const el=document.createElement('div'); el.className='lab';
  el.innerHTML=`<span class="dot"></span><span class="t">${name}</span>`;
  labels.appendChild(el); requestAnimationFrame(()=>el.classList.add('on'));
  tracked.push({child,el});
}

/* camera + render loop */
let ang=0; const _box=new THREE.Box3(), _c=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick); drawBg();
  ang+=.0018;
  const h=LOOK_Y+1.3+Math.sin(ang*1.3)*.35;
  camera.position.set(Math.cos(ang)*ORBIT_R,h,Math.sin(ang)*ORBIT_R); camera.lookAt(0,LOOK_Y,0);
  rimC.position.set(Math.cos(ang+2)*7,3,Math.sin(ang+2)*7);
  const cw=canvas.clientWidth, ch=canvas.clientHeight;
  for(const t of tracked){ _box.setFromObject(t.child); _box.getCenter(_c); _c.y=_box.max.y; _c.project(camera);
    if(_c.z>1){ t.el.style.opacity=0; continue; }
    t.el.style.left=((_c.x*.5+.5)*cw)+'px'; t.el.style.top=((-_c.y*.5+.5)*ch)+'px'; }
  if(bloom) bloom.render(); else renderer.render(scene,camera);
}
function resize(){ const w=canvas.clientWidth||1, hh=canvas.clientHeight||1;
  renderer.setSize(w,hh,false); camera.aspect=w/hh; camera.updateProjectionMatrix(); sizeBg(); if(bloom) bloom.setSize(w,hh); }
if(EffectComposer){ bloom=new EffectComposer(renderer); bloom.addPass(new RenderPass(scene,camera));
  bloom.addPass(new UnrealBloomPass(new THREE.Vector2(1,1),.85,.75,.85)); }
addEventListener('resize',resize); resize(); tick();

/* ---- BOM ---- */
const bomlist=$('#bomlist');
PARTS.forEach((p,i)=>{ const d=document.createElement('div'); d.className='it'; d.id='bom'+i;
  d.innerHTML=`<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span>${p.name}`; bomlist.appendChild(d); });
function tickBom(i){ $('#bom'+i).classList.add('on'); $('#bomcount').textContent=(i+1)+' / 7'; }

/* ---- chat ---- */
const msgs=$('#msgs'), ph=$('#ph');
function bubble(cls,html){ const b=document.createElement('div'); b.className='b '+cls; b.innerHTML=html; msgs.appendChild(b);
  while(msgs.children.length>4) msgs.removeChild(msgs.firstChild); return b; }
async function typeInto(text,sp=60){ ph.classList.remove('empty'); ph.innerHTML='';
  for(let i=0;i<text.length;i++){ ph.innerHTML=text.slice(0,i+1)+'<span class="caret"></span>'; await sleep(sp+Math.random()*40);} }
async function thinking(ms=1100){ const t=bubble('them','<span class="dots"><i></i><i></i><i></i></span>'); await sleep(ms); t.remove(); }
function setCap(s,t){ $('#capstep').textContent=s; $('#captxt').textContent=t; $('#caption').style.opacity=1; }

/* ---- the reel ---- */
let running=false;
async function runReel(){
  if(running) return; running=true;
  // reset
  modelParts.forEach(P=>{ P.holder.visible=false; P.holder.scale.setScalar(.001); });
  tracked.forEach(t=>t.el.remove()); tracked=[];
  msgs.innerHTML=''; ph.classList.add('empty'); ph.textContent='Ask Emrys to build your project…';
  PARTS.forEach((_,i)=>$('#bom'+i).classList.remove('on')); $('#bomcount').textContent='0 / 7';
  $('#caption').style.opacity=0; $('#finale').classList.remove('show'); $('#replay').classList.remove('show');
  $('#bom').classList.remove('show'); $('#nowbuild').style.opacity=0;
  // wait for the model to finish loading before starting
  while(!ready) await sleep(150);
  await sleep(400);

  // STEP 1 — the user responds
  bubble('them','Good morning! I’m <b>Emrys</b> 🎓 What are we building today?'); await sleep(1300);
  await typeInto('Build the Voice Assistant'); await sleep(420);
  const s=$('#send'); s.classList.add('go'); setTimeout(()=>s.classList.remove('go'),260);
  bubble('me','Build the Voice Assistant'); ph.innerHTML=''; ph.classList.add('empty'); ph.textContent='Ask Emrys to build your project…';
  await sleep(450); await thinking(1150);
  bubble('them','On it — assembling <b>Mino</b> from the real model. Watch each part drop in. ⚡'); await sleep(800);

  // high-tech assembly on the big side
  $('#bom').classList.add('show'); $('#nowbuild').style.transition='opacity .6s'; $('#nowbuild').style.opacity=1;
  for(let i=0;i<modelParts.length;i++){ setCap(PARTS[i].step,PARTS[i].cap); await spawnPart(i); tickBom(i); await sleep(780); }

  setCap('Assembly complete','Mino is built — listening, thinking, ready to flash. ✅');
  bubble('them','Mino is assembled ✅ Ready to flash the firmware and say hello?');
  await sleep(2400); $('#caption').style.opacity=0;
  $('#finale').classList.add('show'); await sleep(4400);
  $('#replay').classList.add('show'); running=false;
}
$('#replay').addEventListener('click',runReel);
loadAssembly();
await sleep(300); runReel();
setInterval(()=>{ if(!running && $('#finale').classList.contains('show')) runReel(); },1600);
</script>
