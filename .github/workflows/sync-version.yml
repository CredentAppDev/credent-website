# Keeps the download website's version strings in lockstep with the latest
# desktop release. The desktop repo's release workflow pings this one (via a
# repository_dispatch) right after it publishes a new version; this job rewrites
# the version/URLs/size on the site and commits to main, which GitHub Pages then
# redeploys automatically. No more hand-editing version numbers.
#
# Triggers:
#   • repository_dispatch (event type "desktop-released") — sent by credent-desktop
#     CI after a successful publish. Payload may include client_payload.version.
#   • Manual run (Actions tab) — optionally type a version to force it.
#
# Uses the default GITHUB_TOKEN to commit (contents: write). Pages redeploys on
# the push to main as usual.

name: Sync site version

on:
  repository_dispatch:
    types: [desktop-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync to (e.g. 1.3.0). Leave blank to use the latest release.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve target version
        id: ver
        run: |
          V="${{ github.event.inputs.version || github.event.client_payload.version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Target version: ${V:-<latest release>}"

      - name: Rewrite site version strings
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            node scripts/sync-version.mjs --version "${{ steps.ver.outputs.version }}"
          else
            node scripts/sync-version.mjs
          fi

      - name: Commit & push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already in sync — nothing to commit."
            exit 0
          fi
          git config user.name  "credent-bot"
          git config user.email "noreply@credentgh.com"
          git add index.html app/download.html app/js/main.js
          git commit -m "Site: auto-sync download version to latest release"
          git push origin HEAD:main
