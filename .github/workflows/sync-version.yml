# Keeps the download website's version strings in lockstep with the latest
# desktop release. The desktop repo's release workflow pings this one (via a
# repository_dispatch) right after it publishes a new version; this job rewrites
# the version/URLs/size on the site and commits to main, which GitHub Pages then
# redeploys automatically. No more hand-editing version numbers.
#
# Triggers:
#   • release published IN THIS REPO — the releases live here, so this fires no
#     matter how the installer got uploaded: from CI, or from a developer's
#     machine running `electron-builder --publish always`.
#   • repository_dispatch (event type "desktop-released") — sent by credent-desktop
#     CI after a successful publish. Payload may include client_payload.version.
#   • Manual run (Actions tab) — optionally type a version to force it.
#
# The release trigger exists because 1.6.14 was published straight from a laptop
# rather than through CI. Nothing sent the dispatch, so the site kept advertising
# 1.6.13 while the new installer sat on GitHub — a released version nobody could
# download. Anything that creates a release here now updates the site.
#
# Uses the default GITHUB_TOKEN to commit (contents: write). Pages redeploys on
# the push to main as usual.

name: Sync site version

on:
  release:
    # `published` only. `edited` also fires for each asset upload and metadata
    # tweak electron-builder makes, which started three overlapping runs for one
    # release — they then raced each other's push to main.
    types: [published]
  repository_dispatch:
    types: [desktop-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync to (e.g. 1.3.0). Leave blank to use the latest release.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A release event carries its own tag, and we USE it rather than letting
      # the script look up "the latest release": this repo's REST
      # /releases list endpoint returns [] even though /releases/latest works,
      # so the lookup path throws "No published release found". That was hidden
      # for months because the dispatch path always passed a version.
      #
      # Values arrive as env vars, not inline ${{ }} in the script body — a tag
      # name is attacker-influencable text and must not be pasted into a shell.
      - name: Resolve target version
        id: ver
        env:
          INPUT_VERSION:    ${{ github.event.inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_TAG:      ${{ github.event.release.tag_name }}
          RELEASE_PRE:      ${{ github.event.release.prerelease }}
        run: |
          V="${INPUT_VERSION:-$DISPATCH_VERSION}"
          if [ -z "$V" ] && [ -n "$RELEASE_TAG" ]; then
            if [ "$RELEASE_PRE" = "true" ]; then
              echo "$RELEASE_TAG is a pre-release — leaving the site on the current stable version."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            V="${RELEASE_TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Target version: ${V:-<latest release>}"

      - name: Rewrite site version strings
        id: sync
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -n "$TARGET_VERSION" ]; then
            node scripts/sync-version.mjs --version "$TARGET_VERSION"
          else
            node scripts/sync-version.mjs
          fi

      - name: Commit & push if changed
        if: steps.ver.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already in sync — nothing to commit."
            exit 0
          fi
          git config user.name  "credent-bot"
          git config user.email "noreply@credentgh.com"
          git add index.html app/download.html app/js/main.js
          git commit -m "Site: auto-sync download version to latest release"
          git push origin HEAD:main
