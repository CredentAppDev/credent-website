<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<title>How Mino hears you — Credent's voice engine</title>
<meta name="description" content="An interactive look at Credent's own voice engine: see how Mino turns your speech into action — VAD, speech-to-text, Emrys (the AI brain), and text-to-speech — all Credent-owned." />
<link rel="canonical" href="https://credentgh.com/voice-demo.html" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  :root{ --cyan:#33EBFF; --blue:#0087D1; --indigo:#6C5CE7; --magenta:#FF00FF;
    --bg:#05060c; --text:#eef1fb; --dim:#9aa3c0; --stroke:rgba(255,255,255,.12);
    --grad:linear-gradient(120deg,var(--cyan),var(--blue) 35%,var(--indigo) 65%,var(--magenta));
    --rail:clamp(320px,30vw,420px); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .reel{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(55% 50% at 62% -8%,rgba(108,92,231,.22),transparent 70%),
      radial-gradient(45% 45% at 92% 12%,rgba(255,0,255,.12),transparent 70%),
      radial-gradient(50% 55% at 50% 110%,rgba(51,235,255,.12),transparent 70%),
      linear-gradient(180deg,#070815,#04050b 70%);}
  canvas{display:block}
  #bg{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.65}
  .grid{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.3;
    background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);
    background-size:46px 46px;mask:radial-gradient(75% 75% at 60% 55%,#000 40%,transparent 100%);animation:gp 22s linear infinite}
  @keyframes gp{to{background-position:46px 46px}}
  .vignette{position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 260px rgba(0,0,0,.85)}
  .scan{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.4;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0 1px,transparent 1px 4px)}

  .stage{position:absolute;left:var(--rail);top:0;right:0;bottom:0;z-index:2}
  #three{position:absolute;inset:0;width:100%;height:100%}
  .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;color:var(--dim);font-size:13px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .spin{width:38px;height:38px;border-radius:50%;border:2.5px solid rgba(255,255,255,.12);border-top-color:var(--cyan);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading b{color:var(--cyan);font-variant-numeric:tabular-nums}

  .brandbar{position:absolute;top:28px;left:32px;z-index:8;display:flex;align-items:center;gap:12px}
  .brandbar img{width:34px;height:auto;filter:drop-shadow(0 4px 16px rgba(108,92,231,.55))}
  .brandbar .wm{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:.15em;font-size:15px}
  .brandbar .wm span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brandbar .sub{font-size:10px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
  .home{position:absolute;top:30px;right:34px;z-index:8;font-size:12.5px;color:var(--dim);text-decoration:none;border:1px solid var(--stroke);border-radius:999px;padding:8px 15px;backdrop-filter:blur(8px);transition:.2s}
  .home:hover{color:var(--text);border-color:rgba(51,235,255,.5)}

  /* the pipeline rail (left) */
  .panel{position:absolute;left:22px;top:84px;bottom:22px;z-index:8;width:calc(var(--rail) - 40px);display:flex;flex-direction:column;
    background:linear-gradient(165deg,rgba(20,24,42,.72),rgba(9,11,22,.62));border:1px solid var(--stroke);border-radius:22px;
    backdrop-filter:blur(22px) saturate(140%);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
  .panel-h{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
  .panel-h .k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
  .panel-h h2{font-family:"Space Grotesk",sans-serif;font-size:18px;margin-top:5px;line-height:1.15}
  .panel-h h2 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .steps{flex:1;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
  .step{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:13px;border:1px solid transparent;transition:.3s;opacity:.45}
  .step.on{opacity:1;border-color:rgba(51,235,255,.35);background:rgba(51,235,255,.07);box-shadow:0 0 24px rgba(51,235,255,.12)}
  .step.done{opacity:.8}
  .step .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(8,12,22,.7);border:1px solid rgba(120,200,255,.25)}
  .step .ic svg{width:16px;height:16px;stroke:#bfe9ff;fill:none;stroke-width:2}
  .step.on .ic{background:var(--grad)}.step.on .ic svg{stroke:#04111a}
  .step .tx .nm{font-size:13.5px;font-weight:600}
  .step .tx .ds{font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:2px}
  .step .own{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
    border-radius:5px;padding:2px 5px;align-self:center;white-space:nowrap}
  .own.credent{color:#9af7c9;border:1px solid rgba(40,224,138,.4);background:rgba(40,224,138,.08)}
  .own.claude{color:#ffd9a0;border:1px solid rgba(255,180,80,.4);background:rgba(255,180,80,.08)}

  /* example chat at the bottom of the rail */
  .chat{border-top:1px solid rgba(255,255,255,.07);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-height:118px;justify-content:flex-end}
  .b{max-width:92%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.45;opacity:0;transform:translateY(8px);animation:rise .4s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .b.them{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px}
  .b.me{align-self:flex-end;color:#04111a;background:linear-gradient(120deg,var(--cyan),#6fd0ff);border-bottom-right-radius:4px;font-weight:500}

  .caption{position:absolute;left:calc(var(--rail) + ((100vw - var(--rail))/2));bottom:34px;transform:translateX(-50%);z-index:5;text-align:center;width:min(60%,560px);opacity:0;transition:opacity .4s}
  .caption .step{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}
  .caption .txt{font-size:16px;font-weight:600;margin-top:6px;line-height:1.4;text-shadow:0 2px 22px rgba(0,0,0,.8)}

  .replay{position:absolute;bottom:18px;right:22px;z-index:9;font-family:inherit;font-size:12px;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:999px;padding:8px 15px;cursor:pointer;backdrop-filter:blur(8px);transition:.3s}
  .replay:hover{color:var(--text);border-color:rgba(51,235,255,.5)}

  @media (max-width:820px){
    .stage{left:0;top:48vh;bottom:0}
    .panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:46vh}
    .caption{left:50%;width:86%}
  }
</style>
</head>
<body>
<div class="reel" id="reel">
  <canvas id="bg"></canvas>
  <div class="grid"></div>

  <div class="stage" id="stage">
    <canvas id="three"></canvas>
    <div class="loading" id="loading"><div class="spin"></div><div>Loading Mino… <b id="pct">0%</b></div></div>
  </div>

  <a class="home" href="index.html">← credentgh.com</a>
  <div class="brandbar">
    <img src="assets/logo.svg" alt="Credent" />
    <div><div class="wm">CRE<span>DENT</span></div><div class="sub">Voice Engine</div></div>
  </div>

  <aside class="panel">
    <div class="panel-h">
      <div class="k">How it works · live walkthrough</div>
      <h2>How <b>Mino</b> hears you</h2>
    </div>
    <div class="steps" id="steps"></div>
    <div class="chat" id="chat"></div>
  </aside>

  <div class="caption" id="caption"><div class="step" id="capstep"></div><div class="txt" id="captxt"></div></div>
  <button class="replay" id="replay">↻ Replay</button>
</div>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
let bloom=null, EffectComposer, RenderPass, UnrealBloomPass;
try {
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
} catch(e){ console.warn('bloom unavailable',e); }

const $=s=>document.querySelector(s); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const canvas=$('#three');

/* ── the pipeline: each stage of Credent's voice engine ── */
const STAGES=[
  { nm:'Microphone', own:'credent', cls:'credent',
    ds:'Mino captures your voice as audio.', cap:'Your voice goes in through the mic.',
    icon:'<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>' },
  { nm:'Voice detection (VAD)', own:'credent', cls:'credent',
    ds:'Knows when you start and stop talking — ignores room noise.', cap:'It detects real speech, not background noise.',
    icon:'<path d="M3 12h3l2-7 4 14 2-7h3"/>' },
  { nm:'Speech → text (ASR)', own:'credent', cls:'credent',
    ds:'Turns your spoken words into text. Runs on Credent’s own servers.', cap:'Your words become text — on Credent’s own ASR.',
    icon:'<path d="M4 5h16v11H4z"/><path d="M2 20h20M8 9h8M8 12h5"/>' },
  { nm:'Emrys — the AI brain', own:'claude', cls:'claude',
    ds:'The patient teacher. Understands, replies, and can control the device.', cap:'Emrys understands and decides how to teach.',
    icon:'<path d="M12 3a4 4 0 0 0-4 4 4 4 0 0 0 0 8 4 4 0 0 0 8 0 4 4 0 0 0 0-8 4 4 0 0 0-4-4zM12 7v8"/>' },
  { nm:'Text → speech (TTS)', own:'credent', cls:'credent',
    ds:'Emrys’ reply becomes a warm, spoken voice. Credent-owned.', cap:'The reply becomes Emrys’ spoken voice.',
    icon:'<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8"/>' },
  { nm:'Speaker', own:'credent', cls:'credent',
    ds:'Mino speaks the answer back to you — and acts on the device.', cap:'Mino speaks back — and can act on hardware.',
    icon:'<path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 7a7 7 0 0 1 0 10M19 4a11 11 0 0 1 0 16"/>' },
];

/* build the step list */
const stepsEl=$('#steps');
const stepNodes=STAGES.map((s,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="ic"><svg viewBox="0 0 24 24">${s.icon}</svg></div>
    <div class="tx"><div class="nm">${s.nm}</div><div class="ds">${s.ds}</div></div>
    <div class="own ${s.cls}">${s.own==='claude'?'Emrys':'Credent'}</div>`;
  stepsEl.appendChild(el); return el;
});

/* particles bg */
const bg=$('#bg'),bx=bg.getContext('2d');let pts=[];
function sizeBg(){bg.width=innerWidth;bg.height=innerHeight;pts=Array.from({length:Math.min(90,(bg.width*bg.height)/22000|0)},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,z:Math.random()*.8+.2,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16}));}
function drawBg(){bx.clearRect(0,0,bg.width,bg.height);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x+=bg.width;if(p.x>bg.width)p.x-=bg.width;if(p.y<0)p.y+=bg.height;if(p.y>bg.height)p.y-=bg.height;bx.beginPath();bx.arc(p.x,p.y,p.z*1.7,0,7);bx.fillStyle=`rgba(120,190,255,${p.z*.5})`;bx.fill();}}

/* scene */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.1,500);
scene.add(new THREE.AmbientLight(0x415072,1.0));
scene.add(new THREE.HemisphereLight(0x9fc4ff,0x141826,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(6,9,5); scene.add(key);
const rimC=new THREE.PointLight(0x33EBFF,80,60); rimC.position.set(-8,4,-5); scene.add(rimC);
const rimM=new THREE.PointLight(0xFF00FF,60,60); rimM.position.set(7,2,-7); scene.add(rimM);
try{ const {RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js');
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; }catch(e){}
const floor=new THREE.Mesh(new THREE.CircleGeometry(11,64),new THREE.MeshStandardMaterial({color:0x0a0e1c,metalness:.5,roughness:.5,transparent:true,opacity:.85}));
floor.rotation.x=-Math.PI/2; floor.position.y=-.01; scene.add(floor);
const grid=new THREE.GridHelper(22,32,0x2a3970,0x162043); grid.material.transparent=true; grid.material.opacity=.3; scene.add(grid);
const root=new THREE.Group(); scene.add(root);

/* a pulsing aura ring under Mino that recolors per active stage */
const auraMat=new THREE.MeshBasicMaterial({color:0x33EBFF,transparent:true,opacity:.0});
const aura=new THREE.Mesh(new THREE.RingGeometry(2.6,3.1,64),auraMat);
aura.rotation.x=-Math.PI/2; aura.position.y=.02; scene.add(aura);

let minoMesh=null, SIZE=new THREE.Vector3(), LOOK_Y=2, started=false;
const stlL=new STLLoader();
function loadMino(){ return new Promise((res,rej)=>{
  stlL.load('models/voice-assistant/Mino.stl', g=>res(g),
    e=>{ if(e.total){ $('#pct').textContent=Math.round(e.loaded/e.total*100)+'%'; } },
    err=>rej(err)); }); }

async function buildMino(){
  let geo; try{ geo=await loadMino(); }catch(e){ $('#loading').innerHTML='Could not load model.'; return; }
  geo.computeVertexNormals(); geo.computeBoundingBox(); const bb=geo.boundingBox;
  const size=bb.getSize(new THREE.Vector3()), center=bb.getCenter(new THREE.Vector3());
  const longest=Math.max(size.x,size.y,size.z)||1, norm=5.0/longest;
  const mat=new THREE.MeshStandardMaterial({color:0x16223a,metalness:.5,roughness:.45,emissive:0x06141f,emissiveIntensity:.3});
  minoMesh=new THREE.Mesh(geo,mat); minoMesh.castShadow=true;
  const ng=new THREE.Group(); ng.scale.setScalar(norm); ng.position.set(-center.x*norm,-bb.min.y*norm,-center.z*norm); ng.add(minoMesh);
  root.add(ng);
  SIZE.copy(size).multiplyScalar(norm); LOOK_Y=SIZE.y*0.5;
  aura.scale.setScalar(Math.max(.6,SIZE.x*0.26));
  $('#loading').style.display='none'; started=true;
}

/* camera + render loop */
let ang=0, ORBIT=8.4;
function tick(){
  requestAnimationFrame(tick); drawBg();
  if(started){ ang+=.0016; ORBIT+=(7.4-ORBIT)*0.004; }
  const h=LOOK_Y+1.5+Math.sin(ang*1.2)*.35;
  camera.position.set(Math.cos(ang)*ORBIT,h,Math.sin(ang)*ORBIT); camera.lookAt(0,LOOK_Y*0.9,0);
  rimC.position.set(Math.cos(ang+2)*8,4,Math.sin(ang+2)*8);
  // aura pulse
  const k=(performance.now()%1600)/1600;
  auraMat.opacity = auraTarget*(0.55+0.45*Math.sin(k*6.28));
  if(bloom) bloom.render(); else renderer.render(scene,camera);
}
let auraTarget=0;
function resize(){ const w=canvas.clientWidth||1,hh=canvas.clientHeight||1; renderer.setSize(w,hh,false); camera.aspect=w/hh; camera.updateProjectionMatrix(); sizeBg(); if(bloom) bloom.setSize(w,hh); }
if(EffectComposer){ bloom=new EffectComposer(renderer); bloom.addPass(new RenderPass(scene,camera)); bloom.addPass(new UnrealBloomPass(new THREE.Vector2(1,1),.7,.8,.85)); }
addEventListener('resize',resize); resize(); tick();

/* chat + captions */
const chat=$('#chat');
function bubble(cls,html){ const b=document.createElement('div'); b.className='b '+cls; b.innerHTML=html; chat.appendChild(b); while(chat.children.length>3) chat.removeChild(chat.firstChild); return b; }
function setCap(s,t){ $('#capstep').textContent=s; $('#captxt').textContent=t; $('#caption').style.opacity=1; }
const COLORS=[0x33EBFF,0x33EBFF,0x0087D1,0x6C5CE7,0xFF00FF,0x33EBFF];

function lightStage(i){
  stepNodes.forEach((n,j)=>{ n.classList.toggle('on',j===i); if(j<i) n.classList.add('done'); });
  auraMat.color.setHex(COLORS[i]||0x33EBFF); auraTarget=0.9;
  setCap(`Step ${i+1} / ${STAGES.length}`, STAGES[i].cap);
}

let running=false;
async function run(){
  if(running) return; running=true;
  chat.innerHTML=''; stepNodes.forEach(n=>n.classList.remove('on','done')); auraTarget=0;
  while(!started) await sleep(120);
  await sleep(500);

  // a real example exchange, narrated stage by stage
  for(let i=0;i<STAGES.length;i++){
    lightStage(i);
    if(i===0){ bubble('me','“Hey Emrys, why does my LED stay off?”'); }
    if(i===3){ bubble('them','Let’s check one thing at a time. Is the switch on? 💡'); }
    if(i===5){ bubble('them','I’ll blink it now so you can see it. <b>*click*</b>'); }
    await sleep(i===3?2600:1900);
  }
  stepNodes.forEach(n=>{n.classList.remove('on');n.classList.add('done');});
  setCap('All Credent-owned','Every step runs on Credent — Emrys is the only AI brain. ✅');
  auraMat.color.setHex(0x33EBFF); auraTarget=0.5;
  running=false;
}
$('#replay').addEventListener('click',run);
buildMino(); await sleep(200); run();
setInterval(()=>{ if(!running) run(); }, 14000);
</script>
</body>
</html>
